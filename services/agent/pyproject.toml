[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketpilot-citybattle-agent"
version = "1.1.0"
description = "PocketPilot local desktop agent"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.116,<1", "httpx>=0.28,<1", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
